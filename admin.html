<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Painel - Raio de Luz</title>
  <link rel="icon" href="logo.png">
  <style>
    :root { --bg: #fafafa; --s: #fff; --ink: #111; --m: #5c5c5c; --l: #e3e3e3; --sun: #ffe70e; --ok: #1a7f37; --bad: #c62828; --warn: #8a6d00 }
    @media(prefers-color-scheme:dark) { :root { --bg: #111; --s: #1c1c1c; --ink: #f5f5f5; --m: #b5b5b5; --l: #333; --ok: #4cc26b; --bad: #ff7b7b; --warn: #ffd84d } }
    * { box-sizing: border-box }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif }
    main { max-width: 960px; margin: 0 auto; padding: 20px }
    h1 { margin: 0 0 4px }
    button, select, input, textarea { font: inherit; color: inherit }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px }
    .btn { background: var(--sun); color: #111; border: 0; border-radius: 99px; padding: 8px 16px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block }
    .btn:disabled { opacity: .5; cursor: not-allowed }
    .b2 { background: var(--s); border: 1.5px solid var(--l); border-radius: 99px; padding: 6px 14px; cursor: pointer; text-decoration: none; color: inherit; display: inline-block }
    .b2.on { background: var(--ink); color: var(--bg) }
    .b2.red { color: var(--bad); border-color: var(--bad) }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0 }
    select, input, textarea { border: 1.5px solid var(--l); background: var(--s); border-radius: 10px; padding: 8px }
    input[type=checkbox] { width: auto }
    .box, .o { background: var(--s); border: 1px solid var(--l); border-radius: 14px; padding: 14px; margin-bottom: 12px }
    .o { display: grid; gap: 6px }
    .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }
    .fg { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px }
    .span2 { grid-column: 1 / -1 }
    label { display: grid; gap: 3px; font-size: .85rem; font-weight: 600 }
    label.chk { display: flex; align-items: center; gap: 8px }
    small, .m { color: var(--m) }
    a { color: inherit }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 14px }
    .stat { background: var(--s); border: 1px solid var(--l); border-radius: 14px; padding: 14px }
    .stat b { display: block; font-size: 1.5rem }
    .tag { display: inline-block; border-radius: 99px; padding: 1px 10px; font-size: .78rem; font-weight: 700; border: 1.5px solid var(--l) }
    .tag.ok { color: var(--ok); border-color: var(--ok) }
    .tag.warn { color: var(--warn); border-color: var(--warn) }
    .tag.bad { color: var(--bad); border-color: var(--bad) }
    .thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--l); flex: none }
    .prow { display: flex; gap: 12px; align-items: flex-start }
    .qrbox { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-top: 10px }
    .qrbox .q { width: 200px; border: 1px solid var(--l); border-radius: 10px; overflow: hidden }
    .qrbox svg { display: block; width: 100% }
    .code { font: .75rem/1.3 ui-monospace, monospace; word-break: break-all; max-width: 420px }
    .stars { color: #f5b301 }
    .imgs { display: flex; gap: 12px; flex-wrap: wrap; margin: 8px 0 }
    .im { display: grid; gap: 4px; justify-items: start }
    textarea { width: 100%; font: inherit }
    textarea.mono { font-family: ui-monospace, monospace; font-size: .85rem }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-weight: 600; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s }
    .toast.on { opacity: 1 }
  </style>
</head>

  <script>
    const SUPABASE_URL = "https://hwsaorlbexcmzgajhgps.supabase.co", SUPABASE_ANON_KEY = "sb_publishable_79EGS7VroM7tfzWJItj55A_ZdGnhg6P", ADMIN = "gp.raiodeluz@gmail.com";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const ST = { pedido_realizado: 'Pedido realizado', pagamento_confirmado: 'Pagamento confirmado', preparando: 'Preparando', pronto_para_entrega: 'Pronto para entrega', entregue: 'Entregue', cancelado: 'Cancelado' };

    const NEXTLBL = { pagamento_confirmado: 'Confirmar pagamento', preparando: 'Marcar como preparando', pronto_para_entrega: 'Marcar pronto para entrega', entregue: 'Marcar como entregue' };
    const KIND = { tee: 'Camiseta', long: 'Blusa', sticker: 'Adesivo', mug: 'Caneca', bag: 'Ecobag', keychain: 'Chaveiro', other: 'Outro' };
    const COR = { '#ffe70e': 'Amarelo', '#111111': 'Preto', '#f4f4f4': 'Branco' };
    const DONE = ['entregue', 'cancelado'];
    const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const R = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const num = n => 'RL-' + String(n).padStart(4, '0');
    // estoque <-> texto. Sem cor: "P=5, M=3". Com cor, uma linha por cor: "Preto: P=5, M=3"
    const fmt = (st, mto) => {
      const g = {}; Object.entries(st || {}).forEach(([k, v]) => { const x = splitKey(k); (g[x.color] = g[x.color] || []).push([x.size, v]) });
      return Object.keys(g).sort((a, b) => a.localeCompare(b, 'pt-BR')).map(c => (c ? c + ': ' : '') + g[c].sort((a, b) => sizeCmp(a[0], b[0])).map(([s, v]) => mto ? s : `${s}=${v}`).join(', ')).join('\n');
    };
    const parse = t => {
      const o = {}, clean = x => x.replace(/[|]/g, '').trim();
      String(t).split(/\r?\n/).forEach(line => {
        line = line.trim(); if (!line) return;
        const m = line.match(/^([^:=,]+):\s*(.*)$/), color = m ? clean(m[1]) : '', rest = m ? m[2] : line;
        rest.split(',').forEach(x => { const [k, v] = x.trim().split('='), size = clean(k || ''); if (size) o[variantKey(color, size)] = Math.max(0, parseInt(v) || 0) });
      });
      return o;
    };
    let toastT;
    function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600) }

/*PIX-START*/
const digits = s => String(s || '').replace(/\D/g, '');
const fmtPhone = s => { let d = digits(s); if (d.length > 11 && d.startsWith('55')) d = d.slice(2); return d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}` : d };
const PIXTYPE = { phone: 'Celular', cpf: 'CPF', cnpj: 'CNPJ', email: 'E-mail', random: 'Chave aleatória' };
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function crc16(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF } return c.toString(16).toUpperCase().padStart(4, '0') }
const ascii = (s, n) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9 ]/g, '').toUpperCase().trim().slice(0, n);
function pixKey(type, key) {
  const k = String(key || '').trim();
  if (type === 'phone') { const d = digits(k); return (d.length >= 12 && d.startsWith('55')) ? '+' + d : '+55' + d }
  if (type === 'cpf' || type === 'cnpj') return digits(k);
  if (type === 'email') return k.toLowerCase();
  return k;
}
function pixPayload({ type, key, name, city, amount, txid }) {
  const mai = tlv('26', tlv('00', 'br.gov.bcb.pix') + tlv('01', pixKey(type, key)));
  const tx = String(txid || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 25) || '***';
  const p = tlv('00', '01') + tlv('01', '11') + mai + tlv('52', '0000') + tlv('53', '986')
    + (amount > 0 ? tlv('54', Number(amount).toFixed(2)) : '')
    + tlv('58', 'BR') + tlv('59', ascii(name, 25) || 'LOJA') + tlv('60', ascii(city, 15) || 'BRASIL')
    + tlv('62', tlv('05', tx)) + '6304';
  return p + crc16(p);
}
function qrSvg(text) {
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), m = 4; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + m * 2} ${n + m * 2}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR Code PIX" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
/* variantes: o estoque guarda chaves "Tamanho" ou "Cor / Tamanho" */
const SIZE_ORDER = ['PP', 'P', 'M', 'G', 'GG', 'XG', 'EG', 'G1', 'G2', 'G3', 'G4', 'G5'];
const sizeRank = s => { const u = String(s).toUpperCase(), i = SIZE_ORDER.indexOf(u); if (i >= 0) return i; const n = parseFloat(u); return isNaN(n) ? 500 : 100 + n };
const sizeCmp = (a, b) => sizeRank(a) - sizeRank(b) || String(a).localeCompare(String(b), 'pt-BR');
const splitKey = k => { const i = String(k).indexOf(' / '); return i < 0 ? { color: '', size: String(k) } : { color: k.slice(0, i), size: k.slice(i + 3) } };
const variantKey = (c, s) => c ? c + ' / ' + s : s;
/*PIX-END*/


    const app = document.getElementById('app');
    let rows = [], prods = [], revs = [], S = {}, tab = 'pedidos', filtro = 'pendentes', busca = '', edit = {};

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { app.innerHTML = '<h1>Painel</h1><p>Entre com a conta Google do grupo.</p><button class="btn" data-a="in">Entrar com Google</button>'; return }
      if (session.user.email !== ADMIN) { app.innerHTML = `<h1>Acesso negado</h1><p>${e(session.user.email)} não tem permissão. Use ${e(ADMIN)}.</p><button class="btn" data-a="out">Sair</button>`; return }
      await load();
    }
    async function load() {
      const [o, p, s, r] = await Promise.all([sb.from('orders').select('*').order('created_at', { ascending: false }), sb.from('products').select('*').order('id'), sb.from('settings').select('*'), sb.from('reviews').select('*').order('created_at', { ascending: false })]);
      const er = o.error || p.error || s.error || r.error;
      if (er) { app.textContent = 'Erro ao carregar: ' + er.message + ' (as migrações SQL foram executadas?)'; return }
      rows = o.data; prods = p.data; revs = r.data; S = Object.fromEntries(s.data.map(x => [x.key, x.value])); draw();
    }
    function draw() {
      app.innerHTML = `<div class="top"><div><h1>Painel</h1><small>${e(ADMIN)}</small></div><div class="bar" style="margin:0"><a class="b2" href="index.html" target="_blank" rel="noopener">Ver loja</a><button class="btn" data-a="out">Sair</button></div></div>

        + (tab === 'pedidos' ? ordersView() : tab === 'produtos' ? prodsView() : tab === 'avaliacoes' ? reviewsView() : configView());
    }

    /* ---------- pedidos ---------- */
    function visible() {
      const b = busca.toLowerCase(), bd = busca.replace(/\D/g, '');

    function orderCard(o) {

      <div>${o.items.map(i => `${e(i.qtd)}x ${e(i.produto)} (${e(i.tamanho)})${i.encomenda ? ' <span class="tag">encomenda</span>' : ''}`).join('<br>')}</div>
      <div>Total: <b>${R(o.total)}</b> · <a href="https://wa.me/55${e(o.whatsapp.replace(/\D/g, '').replace(/^55(?=\d{11}$)/, ''))}" target="_blank" rel="noopener">${e(o.whatsapp)}</a>${o.email ? ' · ' + e(o.email) : ''}</div>

    }
    function listHtml() {
      const v = visible();
      return `<div class="m" style="margin-bottom:8px">${v.length} pedido(s)</div>` + (v.map(orderCard).join('') || '<p class="m">Nenhum pedido neste filtro.</p>');
    }
    function ordersView() {
      const sum = a => a.reduce((s, o) => s + Number(o.total), 0);
      const aw = rows.filter(o => o.status === 'pedido_realizado'), pd = rows.filter(o => ['pagamento_confirmado', 'preparando', 'pronto_para_entrega'].includes(o.status)), dl = rows.filter(o => o.status === 'entregue');

      <small>Sem cores: P=5, M=3. Com cores: uma linha por cor (ex.: Preto: P=5, M=3). Sem tamanho: Único=10. Cores reconhecidas mudam a ilustração na loja: Amarelo, Preto, Branco, Azul, Vermelho, Verde, Rosa, Cinza, Laranja, Roxo, Marrom, Bege, Vinho e Azul marinho.</small></form>`
        + (prods.map(x => `<div class="o"><div class="prow">${(x.images && x.images[0] || x.image_url) ? `<img class="thumb" src="${e(x.images && x.images[0] || x.image_url)}" alt="">` : '<div class="thumb"></div>'}
      <div style="flex:1"><div class="top"><b>${e(x.name)} ${x.made_to_order ? '<span class="tag">Sob encomenda</span>' : ''} ${x.active === false ? '<span class="tag warn">Oculto</span>' : ''}</b><b>${R(x.price)}</b></div>
      <small>${e(x.category)} · ${KIND[x.kind] || ''} · ${COR[x.color] || ''} · ${(x.images || []).length} foto(s)</small><div>${x.made_to_order ? 'Sob encomenda. Opções' : 'Estoque'}: ${e(fmt(x.stock, x.made_to_order)).replace(/\n/g, '<br>') || '—'}</div>${x.made_to_order && x.lead_time ? `<small>${e(x.lead_time)}</small>` : ''}</div></div>
      <div class="bar" style="margin:0"><button class="b2" data-a="ed" data-id="${x.id}">Editar</button><button class="b2" data-a="vis" data-id="${x.id}">${x.active === false ? 'Mostrar na loja' : 'Ocultar da loja'}</button>${x.made_to_order ? '' : `<button class="b2" data-a="rep" data-id="${x.id}">Repor estoque</button><button class="b2" data-a="zero" data-id="${x.id}">Zerar estoque</button>`}<button class="b2 red" data-a="delp" data-id="${x.id}">Excluir</button></div></div>`).join('') || '<p class="m">Nenhum produto cadastrado ainda.</p>');
    }
    async function shrink(file, max = 900) {
      const bmp = await createImageBitmap(file), s = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('imagem inválida')), 'image/jpeg', .85));
    }
    async function uploadPhoto(file) {
      const blob = await shrink(file), path = `${crypto.randomUUID()}.jpg`;
      const { error } = await sb.storage.from('product-images').upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
      if (error) throw error;
      return sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;
    }
    async function removePhoto(url) {
      const m = String(url || '').match(/product-images\/([^?]+)$/);
      if (m) { try { await sb.storage.from('product-images').remove([decodeURIComponent(m[1])]) } catch { } }
    }

    const CHART_TPL = 'Masculino\nTamanho | Altura (cm) | Largura (cm)\nP | 73 | 51\nM | 75 | 54\nG | 77 | 57\nGG | 79 | 60\nG1 | 81 | 63\nG2 | 83 | 66\nG3 | 85 | 69\nG4 | 87 | 72\nG5 | 89 | 75\n\nFeminino\nTamanho | Altura (cm) | Largura (cm)\nP | 59 | 46\nM | 61 | 49\nG | 63 | 52\nGG | 65 | 55\nG1 | 67 | 58\nG2 | 69 | 61\nG3 | 71 | 64\nG4 | 73 | 67\nG5 | 75 | 70';
    /* ---------- avaliações ---------- */
    function reviewsView() {
      return `<div class="m" style="margin:10px 0">${revs.length} avaliação(ões). Avaliações ocultas não aparecem na loja.</div>` + (revs.map(r => {
        const p = prods.find(x => x.id === r.product_id);
        return `<div class="o"><div class="top"><b>${e(p ? p.name : 'Produto removido')}</b><small>${new Date(r.created_at).toLocaleString('pt-BR')}</small></div>
        <div><span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span> · ${r.author ? e(r.author) : '<i>Anônimo</i>'} ${r.hidden ? '<span class="tag warn">Oculta</span>' : ''}</div>
        ${r.comment ? `<div style="white-space:pre-line">${e(r.comment)}</div>` : ''}
        <div class="bar" style="margin:0"><button class="b2" data-a="rvis" data-id="${r.id}">${r.hidden ? 'Mostrar na loja' : 'Ocultar'}</button><button class="b2 red" data-a="rdel" data-id="${r.id}">Excluir</button></div></div>`;
      }).join('') || '<p class="m">Nenhuma avaliação ainda.</p>');
    }

    /* ---------- edição de produto: fotos ---------- */
    function snapEdit() {
      const f = app.querySelector('[data-pf]'); if (!f) return; const g = n => f.elements[n];
      Object.assign(edit, { name: g('nome').value, category: g('cat').value, price: g('preco').value, kind: g('kind').value, color: g('cor').value, stock: parse(g('stock').value), description: g('desc').value, details: g('details').value, size_chart: g('chart').value, made_to_order: g('mto').checked, lead_time: g('lead') ? g('lead').value : edit.lead_time, active: g('active').checked });
    }
    async function discardAdded() { for (const u of (edit.added || [])) await removePhoto(u); edit = {} }
    async function uploadMany(inp) {
      const files = [...inp.files]; if (!files.length) return;
      snapEdit(); edit.images = edit.images || []; edit.added = edit.added || [];
      const room = 8 - edit.images.length; if (files.length > room) toast('Limite de 8 fotos: enviando só ' + room + '.');
      toast('Enviando fotos...');
      for (const f of files.slice(0, room)) { try { const u = await uploadPhoto(f); edit.images.push(u); edit.added.push(u) } catch (err) { toast('Não foi possível enviar a foto: ' + err.message) } }
      snapEdit(); draw();
    }

    /* ---------- configurações ---------- */
    function configView() {
      const t = S.pix_type || 'phone';
      return `<form class="box" data-cf><b>Loja</b><div class="fg" style="margin-top:10px">
      <label class="chk span2"><input type="checkbox" name="store_open" ${S.store_open === 'false' ? '' : 'checked'}> Loja aberta para novos pedidos</label>
      <label class="span2">Aviso no topo da loja (deixe vazio para não mostrar)<input name="notice" maxlength="160" value="${e(S.notice)}" placeholder="Ex.: Pedidos até sexta, entrega no encontro de sábado"></label>
      <label class="span2">Informações de entrega<textarea name="delivery_info" rows="2" maxlength="300">${e(S.delivery_info)}</textarea></label>
      <label class="span2">WhatsApp de contato (recebe os comprovantes)<input name="contact_whats" inputmode="tel" value="${e(fmtPhone(S.contact_whats))}" placeholder="(43) 99999-9999"></label></div>
      <hr style="border:0;border-top:1px solid var(--l);margin:16px 0"><b>Pagamento por PIX</b><div class="fg" style="margin-top:10px">
      <label>Tipo da chave<select name="pix_type">${Object.entries(PIXTYPE).map(([k, v]) => `<option value="${k}"${k === t ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
      <label>Chave PIX<input name="pix_key" required value="${e(t === 'phone' ? fmtPhone(S.pix_key) : S.pix_key)}"></label>
      <label>Nome do beneficiário (máx. 25)<input name="pix_name" required maxlength="25" value="${e(S.pix_name)}"></label>
      <label>Cidade (máx. 15)<input name="pix_city" required maxlength="15" value="${e(S.pix_city)}"></label></div>
      <small>Confira a chave com atenção: o dinheiro dos clientes vai para ela. Use o botão de teste e leia o QR Code no app do seu banco; ele deve mostrar o nome do beneficiário correto e R$ 1,00.</small>
      <div class="bar"><button class="btn" type="submit" data-save>Salvar configurações</button><button class="b2" type="button" data-a="testqr">Testar QR Code (R$ 1,00)</button></div>
      <div id="qrtest"></div></form>`;
    }
    function pixOk(t, k) {
      const d = digits(k);
      if (t === 'phone') return d.length === 10 || d.length === 11 || (d.length >= 12 && d.length <= 13 && d.startsWith('55'));
      if (t === 'cpf') return d.length === 11; if (t === 'cnpj') return d.length === 14;
      if (t === 'email') return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(k.trim());
      return k.trim().length >= 32 && k.trim().length <= 36;
    }

    /* ---------- ações ---------- */
    async function run(q, msg) { const { error } = await q; if (error) toast((msg || 'Erro') + ': ' + error.message); await load(); return !error }
    app.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a, id = b.dataset.id, p = prods.find(x => x.id == id);
      if (a === 'in') sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href } });
      else if (a === 'out') { await sb.auth.signOut(); location.reload() }
      else if (a === 'tab') { if ((edit.added || []).length) await discardAdded(); tab = b.dataset.v; draw() }
      else if (a === 'csv') csv();
      else if (a === 'next') { const o = rows.find(x => x.id === id); run(sb.from('orders').update({ status: NEXT[o.status] }).eq('id', id), 'Não foi possível atualizar') }
      else if (a === 'delo') { if (confirm('Excluir este pedido cancelado de vez?')) run(sb.from('orders').delete().eq('id', id)) }
      else if (a === 'ed') { if ((edit.added || []).length) await discardAdded(); edit = { ...p, images: [...(p.images && p.images.length ? p.images : (p.image_url ? [p.image_url] : []))], added: [], removed: [] }; draw(); scrollTo(0, 0) }
      else if (a === 'cancel') { await discardAdded(); draw() }
      else if (a === 'chart-tpl') { if (!edit.size_chart && !(app.querySelector('[name=chart]') || {}).value || confirm('Substituir a tabela atual pelo modelo?')) { snapEdit(); edit.size_chart = CHART_TPL; draw() } }
      else if (a === 'img-del') { snapEdit(); const u = edit.images.splice(+b.dataset.i, 1)[0]; if ((edit.added || []).includes(u)) { edit.added = edit.added.filter(x => x !== u); await removePhoto(u) } else edit.removed = (edit.removed || []).concat(u); draw() }
      else if (a === 'img-cover') { snapEdit(); const u = edit.images.splice(+b.dataset.i, 1)[0]; edit.images.unshift(u); draw() }
      else if (a === 'rvis') { const r = revs.find(x => x.id == id); run(sb.from('reviews').update({ hidden: !r.hidden }).eq('id', id)) }
      else if (a === 'rdel') { if (confirm('Excluir esta avaliação de vez?')) run(sb.from('reviews').delete().eq('id', id)) }
      else if (a === 'vis') run(sb.from('products').update({ active: p.active === false }).eq('id', id))
      else if (a === 'zero') { if (confirm('Zerar o estoque de ' + p.name + '?')) run(sb.from('products').update({ stock: Object.fromEntries(Object.keys(p.stock).map(k => [k, 0])) }).eq('id', id)) }
      else if (a === 'rep') { const n = parseInt(prompt('Quantas unidades repor em CADA tamanho de ' + p.name + '?', '5')); if (n > 0) run(sb.from('products').update({ stock: Object.fromEntries(Object.entries(p.stock).map(([k, v]) => [k, v + n])) }).eq('id', id)) }
      else if (a === 'delp') { if (confirm('Excluir ' + p.name + '? Pedidos antigos continuam guardados.')) { for (const u of (p.images || []).concat(p.image_url ? [p.image_url] : [])) await removePhoto(u); run(sb.from('products').delete().eq('id', id)) } }
      else if (a === 'testqr') testQr();
    });
    function testQr() {
      const f = Object.fromEntries(new FormData(app.querySelector('[data-cf]')));
      if (!pixOk(f.pix_type, f.pix_key)) return toast('A chave PIX não parece válida para o tipo escolhido.');
      const code = pixPayload({ type: f.pix_type, key: f.pix_key, name: f.pix_name, city: f.pix_city, amount: 1, txid: 'TESTE' });
      let svg = ''; try { svg = qrSvg(code) } catch { }
      document.getElementById('qrtest').innerHTML = `<div class="qrbox"><div class="q">${svg}</div><div><b>Chave enviada ao app do banco:</b><br><span data-k></span><div class="code" data-c></div></div></div>`;
      document.querySelector('[data-k]').textContent = pixKey(f.pix_type, f.pix_key);
      document.querySelector('[data-c]').textContent = code;
    }
    app.addEventListener('input', ev => {
      const t = ev.target;
      if (t.matches('[data-q]')) { busca = t.value; document.getElementById('olist').innerHTML = listHtml() }
      else if (t.name === 'contact_whats') t.value = fmtPhone(t.value);
    });
    app.addEventListener('change', ev => {
      const t = ev.target;
      if (t.matches('[data-foto]')) uploadMany(t);
      else if (t.name === 'mto') { snapEdit(); draw() }
      else if (t.matches('[data-f]')) { filtro = t.value; draw() }
      else if (t.matches('[data-st]')) {
        if (t.value === 'cancelado' && !confirm('Cancelar o pedido? Depois disso ele não poderá mais ser alterado e o estoque volta.')) { draw(); return }
        run(sb.from('orders').update({ status: t.value }).eq('id', t.dataset.st), 'Não foi possível atualizar');
      }
    });
    app.addEventListener('submit', async ev => {
      const form = ev.target;
      if (form.matches('[data-pf]')) {
        ev.preventDefault();
        const f = Object.fromEntries(new FormData(form)), st = parse(f.stock), btn = form.querySelector('[data-save]');
        if (!Object.keys(st).length) return toast('Informe o estoque, por exemplo: P=5, M=3 (ou Preto: P=5, M=3)');
        btn.disabled = true; btn.textContent = 'Salvando...';
        const images = edit.images || [], removed = edit.removed || [];
        const d = { name: f.nome.trim(), category: f.cat.trim(), price: f.preco, kind: f.kind, color: f.cor, stock: st, description: (f.desc || '').trim() || null, details: (f.details || '').trim() || null, size_chart: (f.chart || '').trim() || null, made_to_order: !!f.mto, lead_time: (f.mto && (f.lead || '').trim()) || null, active: !!f.active, images, image_url: images[0] || null };
        const q = edit.id ? sb.from('products').update(d).eq('id', edit.id) : sb.from('products').insert(d);
        const ok = await run(q, 'Não foi possível salvar');
        if (ok) { for (const u of removed) await removePhoto(u); edit = {}; draw(); toast('Produto salvo') }
      } else if (form.matches('[data-cf]')) {
        ev.preventDefault();
        const f = Object.fromEntries(new FormData(form));
        if (!pixOk(f.pix_type, f.pix_key)) return toast('A chave PIX não parece válida para o tipo escolhido.');
        if (digits(f.contact_whats).length < 10) return toast('Informe um WhatsApp de contato válido, com DDD.');
        const newKey = f.pix_type === 'phone' ? pixKey('phone', f.pix_key) : f.pix_key.trim();
        const oldKey = S.pix_type === 'phone' ? pixKey('phone', S.pix_key || '') : (S.pix_key || '');
        if ((newKey !== oldKey || f.pix_type !== S.pix_type) && !confirm('Os próximos pagamentos serão feitos para a chave:\n\n' + newKey + '\n\nConfirma?')) return;
        const rows2 = [['store_open', f.store_open ? 'true' : 'false'], ['notice', f.notice.trim()], ['delivery_info', f.delivery_info.trim()], ['contact_whats', digits(f.contact_whats)],
        ['pix_type', f.pix_type], ['pix_key', f.pix_type === 'phone' ? digits(f.pix_key) : f.pix_key.trim()], ['pix_name', f.pix_name.trim()], ['pix_city', f.pix_city.trim()]].map(([key, value]) => ({ key, value }));
        const { error } = await sb.from('settings').upsert(rows2);
        if (error) return toast('Não foi possível salvar: ' + error.message);
        await load(); toast('Configurações salvas');
      }
    });
    function csv() {
      const v = visible(), q = x => '"' + String(x ?? '').replace(/"/g, '""') + '"';
      const t = ['Pedido;Data;Nome;WhatsApp;Itens;Total;Status;Obs', ...v.map(o => [num(o.number), new Date(o.created_at).toLocaleString('pt-BR'), o.customer_name, o.whatsapp, o.items.map(i => `${i.qtd}x ${i.produto} (${i.tamanho})`).join(' | '), o.total, ST[o.status], o.notes].map(q).join(';'))].join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + t], { type: 'text/csv' })); a.download = 'pedidos.csv'; a.click();
    }
    init();
  </script>
</body>

</html>
