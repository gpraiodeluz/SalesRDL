<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de pedidos - Raio de Luz</title>
<style>
:root{--bg:#fafafa;--s:#fff;--ink:#111;--m:#5c5c5c;--l:#e3e3e3;--sun:#ffe70e}
@media(prefers-color-scheme:dark){:root{--bg:#111;--s:#1c1c1c;--ink:#f5f5f5;--m:#b5b5b5;--l:#333}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px}h1{margin:0 0 4px}
button,select{font:inherit;color:inherit}
.btn{background:var(--sun);color:#111;border:0;border-radius:99px;padding:9px 18px;font-weight:700;cursor:pointer}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
select{border:1.5px solid var(--l);background:var(--s);border-radius:10px;padding:8px}
.box,.o{background:var(--s);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px}
.o{display:grid;gap:6px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
small,.m{color:var(--m)}a{color:inherit}
</style></head><body><main id="app">Carregando...</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://hwsaorlbexcmzgajhgps.supabase.co",SUPABASE_ANON_KEY="sb_publishable_79EGS7VroM7tfzWJItj55A_ZdGnhg6P",ADMIN="gp.raiodeluz@gmail.com";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const ST={pedido_realizado:'Pedido realizado',pagamento_confirmado:'Pagamento confirmado',preparando:'Preparando',pronto_para_entrega:'Pronto para entrega',entregue:'Entregue',cancelado:'Cancelado'};
const DONE=['entregue','cancelado'];
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const app=document.getElementById('app');let rows=[],filtro='pendentes';
async function init(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session){app.innerHTML='<h1>Painel de pedidos</h1><p>Entre com a conta Google do grupo.</p><button class="btn" id="in">Entrar com Google</button>';
  document.getElementById('in').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});return}
 if(session.user.email!==ADMIN){app.innerHTML=`<h1>Acesso negado</h1><p>${e(session.user.email)} não tem permissão. Use ${ADMIN}.</p><button class="btn" id="out">Sair</button>`;
  document.getElementById('out').onclick=async()=>{await sb.auth.signOut();location.reload()};return}
 await load();
}
async function load(){
 const{data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});
 if(error){app.textContent='Erro ao carregar pedidos: '+error.message;return}
 rows=data;draw();
}
function draw(){
 const vis=rows.filter(o=>filtro==='todos'||(filtro==='pendentes'?!DONE.includes(o.status):o.status===filtro));
 const sep={};rows.filter(o=>!DONE.includes(o.status)).forEach(o=>o.items.forEach(i=>{const k=`${i.produto} (${i.tamanho})`;sep[k]=(sep[k]||0)+i.qtd}));
 app.innerHTML=`<div class="top"><div><h1>Pedidos</h1><small>${e(ADMIN)}</small></div><button class="btn" id="out">Sair</button></div>
 <div class="box"><b>Para separar (pedidos pendentes)</b><br>${Object.keys(sep).length?Object.entries(sep).map(([k,q])=>`${q}x ${e(k)}`).join('<br>'):'<span class="m">Nada pendente.</span>'}</div>
 <div class="bar"><select id="f"><option value="pendentes">Pendentes</option><option value="todos">Todos</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
 <button class="btn" id="csv">Baixar CSV</button><span class="m">${vis.length} pedido(s)</span></div>`+
 (vis.map(o=>`<div class="o"><div class="top"><b>RL-${String(o.number).padStart(4,'0')} · ${e(o.customer_name)}</b><small>${new Date(o.created_at).toLocaleString('pt-BR')}</small></div>
 <div>${o.items.map(i=>`${e(i.qtd)}x ${e(i.produto)} (${e(i.tamanho)})`).join('<br>')}</div>
 <div>Total: <b>${R(o.total)}</b> · <a href="https://wa.me/55${e(o.whatsapp.replace(/\D/g,''))}" target="_blank" rel="noopener">${e(o.whatsapp)}</a></div>
 ${o.notes?`<small>Obs: ${e(o.notes)}</small>`:''}
 <select data-id="${o.id}">${Object.entries(ST).map(([k,v])=>`<option value="${k}"${k===o.status?' selected':''}>${v}</option>`).join('')}</select></div>`).join('')||'<p class="m">Nenhum pedido neste filtro.</p>');
 document.getElementById('f').value=filtro;
 document.getElementById('f').onchange=ev=>{filtro=ev.target.value;draw()};
 document.getElementById('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
 document.getElementById('csv').onclick=()=>csv(vis);
 app.querySelectorAll('.o select').forEach(s=>s.onchange=async()=>{
  const{error}=await sb.from('orders').update({status:s.value}).eq('id',s.dataset.id);
  if(error){alert('Não foi possível atualizar: '+error.message);return}
  rows.find(o=>o.id===s.dataset.id).status=s.value;draw();
 });
}
function csv(v){
 const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
 const t=['Pedido;Data;Nome;WhatsApp;Itens;Total;Status;Obs',...v.map(o=>[ 'RL-'+o.number,new Date(o.created_at).toLocaleString('pt-BR'),o.customer_name,o.whatsapp,o.items.map(i=>`${i.qtd}x ${i.produto} (${i.tamanho})`).join(' | '),o.total,ST[o.status],o.notes].map(q).join(';'))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='pedidos.csv';a.click();
}
init();
</script></body></html>
